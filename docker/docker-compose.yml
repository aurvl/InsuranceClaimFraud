services:
  postgres:
    image: postgres:16
    container_name: insurance_claim_counterfactual_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance_claims}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${COMPOSE_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-insurance_claims}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: insurance_claim_counterfactual_api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-insurance_claims}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MODEL_DECISION_THRESHOLD: ${MODEL_DECISION_THRESHOLD:-0.5}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
